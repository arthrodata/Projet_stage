<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioData Explorer - Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="search.css">
</head>

<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">B</div>
            <div>
                <h1>BioData Explorer</h1>
                <p>Biological occurrences</p>
            </div>
        </div>

        <nav class="side-nav" aria-label="Main navigation">
            <a class="nav-item" href="dashboard.html">
                <span class="nav-icon">DB</span>
                Dashboard
            </a>
            <a class="nav-item" href="search.html#searchPanel">
                <span class="nav-icon">RE</span>
                Search
            </a>
            <a class="nav-item" href="exports.html">
                <span class="nav-icon">CSV</span>
                CSV exports
            </a>
            <a class="nav-item active" href="admin.html" data-admin-link="true">
                <span class="nav-icon">AD</span>
                Admin
            </a>
        </nav>
    </aside>

    <main class="main-area">
        <header class="topbar">
            <div class="topbar-title">
                <span class="section-kicker">Administration</span>
                <h2>User validation</h2>
            </div>
        </header>

        <section class="panel">
            <div class="panel-heading compact">
                <div>
                    <span class="section-kicker">Accounts</span>
                    <h3>Registered users</h3>
                </div>
                <div id="adminMessage" class="message-pill neutral">Loading...</div>
            </div>

            <div id="passwordResetBox" class="password-reset-box" hidden>
                <div>
                    <span class="section-kicker">Temporary password</span>
                    <strong id="passwordResetUser">User</strong>
                    <code id="passwordResetValue"></code>
                </div>
                <button type="button" id="copyPasswordBtn" class="btn-muted">Copy</button>
            </div>

            <div class="table-card">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Last name</th>
                            <th>First name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Role</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody">
                        <tr>
                            <td colspan="7" class="empty-state">Loading users.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="panel admin-cleanup-panel">
            <div class="panel-heading compact">
                <div>
                    <span class="section-kicker">Maintenance</span>
                    <h3>Database cleanup</h3>
                </div>
            </div>
            <div class="admin-cleanup-actions">
                <button type="button" id="clearHistoryBtn" class="btn-danger">Clear search history</button>
                <button type="button" id="deleteUnvalidatedBtn" class="btn-danger">Delete unvalidated accounts</button>
            </div>
        </section>
    </main>
</div>

<script src="config.js"></script>
<script data-src="auth.js"></script>
<script data-src="admin.js"></script>
<script src="asset-loader.js"></script>
</body>
</html>
