<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioData Explorer - CSV History</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="search.css">
    <link rel="stylesheet" href="exports.css">
</head>

<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">B</div>
            <div>
                <h1>BioData Explorer</h1>
                <p>Biological occurrences</p>
            </div>
        </div>

        <nav class="side-nav" aria-label="Main navigation">
            <a class="nav-item" href="dashboard.html">
                <span class="nav-icon">DB</span>
                Dashboard
            </a>
            <a class="nav-item" href="search.html">
                <span class="nav-icon">RE</span>
                Search
            </a>
            <a class="nav-item active" href="exports.html">
                <span class="nav-icon">CSV</span>
                CSV exports
            </a>
        </nav>

    </aside>

    <main class="main-area">
        <header class="exports-topbar">
            <div>
                <span class="section-kicker">Exports</span>
                <h2>CSV History</h2>
                <p>Last 10 generated exports.</p>
            </div>
        </header>

        <section class="panel exports-panel">
            <div class="panel-heading compact">
                <div>
                    <span class="section-kicker">Files</span>
                    <h3>Recent exports</h3>
                </div>
                <div id="exportsMessage" class="message-pill neutral">Loading...</div>
            </div>

            <div class="exports-summary">
                <article>
                    <span>Searches</span>
                    <strong id="summarySearches">0 searches</strong>
                </article>
                <article>
                    <span>Records</span>
                    <strong id="summaryRecords">0 records</strong>
                </article>
                <article>
                    <span>Latest</span>
                    <strong id="summaryDate">No recent export</strong>
                </article>
            </div>

            <div class="exports-table-card">
                <table class="exports-table">
                    <thead>
                        <tr>
                            <th>Search</th>
                            <th>File</th>
                            <th>Source</th>
                            <th>Records</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="exportsBody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="config.js"></script>
<script data-src="auth.js"></script>
<script data-src="exports.js"></script>
<script src="asset-loader.js"></script>
</body>
</html>
