<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioData Explorer - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="search.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-panel">
        <div class="brand auth-brand">
            <div class="brand-mark">B</div>
            <div>
                <h1>BioData Explorer</h1>
                <p>Personal workspace</p>
            </div>
        </div>

        <div class="panel-heading auth-heading">
            <div>
                <span class="section-kicker">Account</span>
                <h2>Access your workspace</h2>
                <p>Sign in to keep your searches, exports and charts separate from other users.</p>
            </div>
            <div id="authMessage" class="message-pill neutral">Sign in or create an account.</div>
        </div>

        <div class="auth-mode-tabs" role="group" aria-label="Authentication mode">
            <button type="button" id="loginModeBtn" class="auth-mode active">Log in</button>
            <button type="button" id="signupModeBtn" class="auth-mode">Sign up</button>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="field">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" type="email" autocomplete="email" required placeholder="first.last@university.edu">
            </div>
            <div class="field">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" autocomplete="current-password" required minlength="6">
            </div>
            <div class="button-row">
                <button type="submit" id="loginBtn" class="btn-primary">Log in</button>
            </div>
        </form>

        <form id="signupForm" class="auth-form" hidden>
            <div class="auth-name-grid">
                <div class="field">
                    <label for="signupFirstName">First name</label>
                    <input id="signupFirstName" type="text" autocomplete="given-name" placeholder="Oussama">
                </div>
                <div class="field">
                    <label for="signupLastName">Last name</label>
                    <input id="signupLastName" type="text" autocomplete="family-name" placeholder="Bekolli">
                </div>
            </div>
            <div class="field">
                <label for="signupEmail">Email</label>
                <input id="signupEmail" type="email" autocomplete="email" required placeholder="first.last@university.edu">
            </div>
            <div class="field">
                <label for="signupPassword">Password</label>
                <input id="signupPassword" type="password" autocomplete="new-password" required minlength="6">
            </div>
            <div class="button-row">
                <button type="submit" id="signupSubmitBtn" class="btn-primary">Create account</button>
            </div>
        </form>
    </section>
</main>

<script src="config.js"></script>
<script data-src="auth.js"></script>
<script data-src="login.js"></script>
<script src="asset-loader.js"></script>
</body>
</html>
