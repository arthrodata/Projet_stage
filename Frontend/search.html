<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche Tortricidae</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="search.css">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-2">Recherche Tortricidae</h1>
    <p class="text-muted mb-4">Test simple Frontend ↔ Backend FastAPI</p>

    <div class="card p-4 mb-4 shadow-sm">

        <!-- PAS DE FORM ICI POUR ÉVITER LE RECHARGEMENT -->
        <div class="row g-3">

            <div class="col-md-4">
                <label for="species" class="form-label">Espèce</label>
                <input 
                    type="text" 
                    id="species" 
                    class="form-control" 
                    placeholder="Ex : Cydia pomonella">
            </div>

            <div class="col-md-4">
                <label for="genus" class="form-label">Genre</label>
                <input 
                    type="text" 
                    id="genus" 
                    class="form-control" 
                    placeholder="Ex : Cydia">
            </div>

            <div class="col-md-4">
                <label for="country" class="form-label">Pays</label>
                <input 
                    type="text" 
                    id="country" 
                    class="form-control" 
                    placeholder="Ex : France">
            </div>

            <div class="col-12 mt-3">
                <button type="button" id="searchBtn" class="btn btn-primary">
                    Rechercher
                </button>

                <button type="button" id="resetBtn" class="btn btn-secondary">
                    Reset
                </button>

                <button type="button" id="exportBtn" class="btn btn-success">
                    Export CSV
                </button>
            </div>

        </div>

    </div>

    <div id="message" class="mb-3"></div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h4 class="mb-0">Résultats</h4>
        <p id="countText" class="text-muted mb-0">Aucune recherche lancée.</p>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Country</th>
                    <th>Localisation</th>
                    <th>Date</th>
                    <th>Dataset</th>
                    <th>Famille</th>
                    <th>Genre</th>
                    <th>Espèce</th>
                </tr>
            </thead>

            <tbody id="resultsBody">
                <tr>
                    <td colspan="7" class="text-center text-muted">
                        Aucun résultat à afficher.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="search.js"></script>
</body>
</html>
