<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche biodiversite</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="search.css">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-2">Recherche biodiversite</h1>
    <p class="text-muted mb-4">Recherche GBIF avec filtres famille, genre, espece et pays</p>

    <div class="card p-4 mb-4 shadow-sm">
        <div class="row g-3">

            <div class="col-md-3">
                <label for="sourceSelect" class="form-label">Source</label>
                <select id="sourceSelect" class="form-select">
                    <option value="gbif" selected>GBIF</option>
                    <option value="silene_expert">Silene Expert</option>
                    <option value="both">GBIF + Silene Expert</option>
                </select>
                <div class="form-text">Les filtres s'appliquent a GBIF (mapping Silene ensuite).</div>
            </div>

            <div class="col-md-3">
                <label for="family" class="form-label">Famille</label>
                <input
                    type="text"
                    id="family"
                    class="form-control"
                    placeholder="Ex : Felidae">
            </div>

            <div class="col-md-3">
                <label for="species" class="form-label">Espece</label>
                <input
                    type="text"
                    id="species"
                    class="form-control"
                    placeholder="Ex : Panthera leo">
            </div>

            <div class="col-md-3">
                <label for="genus" class="form-label">Genre</label>
                <input
                    type="text"
                    id="genus"
                    class="form-control"
                    placeholder="Ex : Panthera">
            </div>

            <div class="col-md-3">
                <label for="country" class="form-label">Pays</label>
                <input
                    type="text"
                    id="country"
                    class="form-control"
                    placeholder="Ex : France">
            </div>

            <div class="col-12 mt-3">
                <button type="button" id="searchBtn" class="btn btn-primary">
                    Rechercher
                </button>

                <button type="button" id="resetBtn" class="btn btn-secondary">
                    Reset
                </button>

                <button type="button" id="exportBtn" class="btn btn-success">
                    Export CSV
                </button>
            </div>

        </div>
    </div>

    <div id="message" class="mb-3"></div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h4 class="mb-0">Resultats</h4>
        <p id="countText" class="text-muted mb-0">Aucune recherche lancee.</p>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Source</th>
                    <th>Country</th>
                    <th>Coordinates</th>
                    <th>Date</th>
                    <th>Basis</th>
                    <th>Dataset</th>
                    <th>Famille</th>
                    <th>Genre</th>
                    <th>Espece</th>
                    <th>IUCN</th>
                </tr>
            </thead>

            <tbody id="resultsBody">
                <tr>
                    <td colspan="10" class="text-center text-muted">
                        Aucun resultat a afficher.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="search.js?v=20260522-fix-search"></script>
</body>
</html>
